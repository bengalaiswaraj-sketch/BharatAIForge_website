<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36D9FF" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#22D3B6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#071426" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36D9FF" />
      <stop offset="100%" stop-color="#22D3B6" />
    </linearGradient>
    <linearGradient id="edgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBE55" />
      <stop offset="100%" stop-color="#36D9FF" />
    </linearGradient>
  </defs>

  <!-- Ambient Halo -->
  <circle cx="300" cy="260" r="230" fill="url(#coreGlow)" />
  <circle cx="300" cy="260" r="185" stroke="#36D9FF" stroke-opacity="0.18" stroke-dasharray="6 8" />
  <circle cx="300" cy="260" r="135" stroke="#22D3B6" stroke-opacity="0.25" />

  <!-- Outer Hexagonal Neural Forge Lattice -->
  <polygon points="300,65 468,162 468,358 300,455 132,358 132,162" stroke="url(#edgeCyan)" stroke-opacity="0.5" stroke-width="1.75" fill="#0B1E36" fill-opacity="0.45" />
  <polygon points="300,115 425,187 425,333 300,405 175,333 175,187" stroke="#FFBE55" stroke-opacity="0.35" stroke-width="1.25" />

  <!-- Neural Synaptic Connections -->
  <g stroke="url(#edgeCyan)" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="300" y1="65" x2="300" y2="260" />
    <line x1="468" y1="162" x2="300" y2="260" />
    <line x1="468" y1="358" x2="300" y2="260" />
    <line x1="300" y1="455" x2="300" y2="260" />
    <line x1="132" y1="358" x2="300" y2="260" />
    <line x1="132" y1="162" x2="300" y2="260" />
    <line x1="175" y1="187" x2="425" y2="187" />
    <line x1="175" y1="333" x2="425" y2="333" />
    <line x1="300" y1="115" x2="175" y2="333" />
    <line x1="300" y1="115" x2="425" y2="333" />
  </g>

  <!-- Central AI Core Octahedron -->
  <polygon points="300,175 375,260 300,345 225,260" fill="#102A43" fill-opacity="0.88" stroke="url(#edgeGold)" stroke-width="2.2" />
  <circle cx="300" cy="260" r="26" fill="#071426" stroke="#36D9FF" stroke-width="2.5" />
  <circle cx="300" cy="260" r="10" fill="#36D9FF" />

  <!-- Glowing Nodes -->
  <circle cx="300" cy="65" r="7" fill="#36D9FF" />
  <circle cx="468" cy="162" r="7" fill="#22D3B6" />
  <circle cx="468" cy="358" r="7" fill="#36D9FF" />
  <circle cx="300" cy="455" r="7" fill="#FFBE55" />
  <circle cx="132" cy="358" r="7" fill="#22D3B6" />
  <circle cx="132" cy="162" r="7" fill="#36D9FF" />

  <circle cx="300" cy="115" r="5" fill="#FFBE55" />
  <circle cx="425" cy="187" r="5" fill="#36D9FF" />
  <circle cx="425" cy="333" r="5" fill="#22D3B6" />
  <circle cx="300" cy="405" r="5" fill="#36D9FF" />
  <circle cx="175" cy="333" r="5" fill="#FFBE55" />
  <circle cx="175" cy="187" r="5" fill="#22D3B6" />
</svg>
